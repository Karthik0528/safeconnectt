name: saFeConnect CI — E2E, Load, & Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    # ── Setup ────────────────────────────────────────────────
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Create local env files
      run: |
        echo "EXPO_PUBLIC_BACKEND_URL=http://localhost:8000" > frontend/.env
        echo "MONGO_URL=mongodb+srv://saFeConnect6:saFECOnnect@safeconnect.vlhh8jp.mongodb.net/?retryWrites=true&w=majority&appName=saFeConnect" > backend/.env
        echo "DB_NAME=safeconnect" >> backend/.env
        echo "JWT_SECRET=safeconnectsecret123" >> backend/.env
        echo "EMERGENT_LLM_KEY=disabled" >> backend/.env

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r backend/requirements.txt
        python -m pip install pytest requests openpyxl selenium webdriver-manager pytest-mock

    - name: Install Frontend Node Dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps

    # ── Build & Serve ────────────────────────────────────────
    - name: Start local FastAPI backend server
      run: |
        cd backend
        python -m uvicorn server:app --host 127.0.0.1 --port 8000 &

    - name: Export/Build Expo Web static assets
      run: |
        cd frontend
        npx expo export --platform web

    - name: Serve static Expo Web frontend
      run: |
        python -m http.server 8081 --directory frontend/dist &

    - name: Wait for background servers to spin up
      run: sleep 10

    # ── E2E & Regression Tests ───────────────────────────────
    - name: Run E2E & Pytest Test Suite
      run: |
        python run_suite.py

    # ── Load Testing ─────────────────────────────────────────
    - name: Run Baseline Load Test (Guides Endpoint)
      run: |
        python tests/load_test.py --url http://127.0.0.1:8000/api/guides --users 100 --duration 60 --name guides

    - name: Run Baseline Load Test (Health Endpoint)
      run: |
        python tests/load_test.py --url http://127.0.0.1:8000/api/ --users 100 --duration 60 --name health

    # ── Security Vulnerability Scan ──────────────────────────
    - name: Run Static Security Audit
      run: |
        python tests/security_scan.py

    # ── Report Generation ────────────────────────────────────
    - name: Generate Unified Load Test Excel Report
      run: |
        python tests/generate_excel.py

    - name: Generate GitHub Actions Job Summary
      if: always()
      run: |
        python tests/generate_github_summary.py

    # ── Artifact Upload ──────────────────────────────────────
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: saFeConnect-Test-Reports
        path: |
          test_reports/E2E_Test_Report_saFeConnect.xlsx
          test_reports/Load_Test_Report_saFeConnect.xlsx
          test_reports/Security_Vulnerabilities_saFeConnect.xlsx
          test_reports/github_step_summary.md
          test_reports/security_executive_summary.md
          test_reports/security_detailed_findings.md
          test_reports/load_test_report_guides.json
          test_reports/load_test_report_health.json
